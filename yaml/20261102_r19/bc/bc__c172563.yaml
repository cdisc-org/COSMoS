shortName: Ultrasonographic Elastography
synonyms:
  - Ultrasound Elastography
resultScales:
  - Nominal
definition: A noninvasive technique that is used to measure organ or tissue stiffness. An ultrasound wave is passed into the organ or tissue from a small transducer on the end of an ultrasound probe which measures the velocity of the shear wave (in meters per second) as this wave passes through the organ or tissue. The shear wave velocity can then be converted into organ or tissue stiffness. This technique may be used as an alternative to organ or tissue biopsy.
