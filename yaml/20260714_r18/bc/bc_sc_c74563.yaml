definition: A classification system used by dermatologists to determine a person's risk for sunburn. The classification is based on the skin complexion and the degree of tolerance to sun exposure and it relates to the amount of melanin pigment in the skin. It was developed by Dr. Thomas Fitzpatrick in 1975 to determine patient's skin reaction to laser and light therapy treatments. According to this system, there are six skin varieties classified from I to VI.
