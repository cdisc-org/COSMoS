# Transcribed from the active block of utilities/convert_crf_xlsx2yaml.sas (crf_updates branch).
# Unlike the 20260630 draft (one combined workbook), this package reads one workbook per CRF
# domain from curation/draft/crf/.
release: "20260731_draft"
domain: crf
package: "20260731"
override_package_date: "2026-07-31"
out_folder: yaml/20260731_draft/crf
